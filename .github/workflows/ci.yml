name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: the jobs only check out, test and build.
permissions:
  contents: read

jobs:
  checks:
    name: Lint, unit tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # No dependency lifecycle scripts: nothing in the tree needs one, and they are the usual
      # way a compromised package runs code in CI.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      # Includes the content build, type-check, static SEO pages and their validation.
      - run: npm run build
      # Pull requests only build it; storybook.yml publishes from main.
      - run: npm run build-storybook

  e2e:
    name: End-to-end and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # The Playwright CLI from the lockfile, never one fetched on demand by npx.
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
